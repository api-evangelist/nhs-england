apis:
- aid: nhs-england:nhs-personal-demographics-service-fhir
  name: Personal Demographics Service (PDS) - FHIR API
  description: >-
    National electronic database of NHS patient demographic details - name, address, date of birth, related
    people, registered GP, nominated pharmacy and NHS number - exposed as an HL7 FHIR R4 API. Production
    endpoint confirmed live and auth-gated (HTTP 401 without a token).
  humanURL: https://digital.nhs.uk/developer/api-catalogue/personal-demographics-service-fhir
  baseURL: https://api.service.nhs.uk/personal-demographics/FHIR/R4
  tags:
  - FHIR
  - Demographics
  - Patient
  properties:
  - type: Documentation
    url: https://digital.nhs.uk/developer/api-catalogue/personal-demographics-service-fhir
- aid: nhs-england:nhs-gp-connect-access-record-structured-fhir
  name: GP Connect Access Record - Structured - FHIR API
  description: >-
    Lets authorised health and social care staff retrieve a patient's GP practice record as structured
    HL7 FHIR resources (medications, allergies, problems, immunisations, and more) from EMIS and TPP SystmOne
    GP systems.
  humanURL: https://digital.nhs.uk/developer/api-catalogue/gp-connect-access-record-structured-fhir
  tags:
  - FHIR
  - GP Connect
  - Clinical Record
  properties:
  - type: Documentation
    url: https://digital.nhs.uk/developer/api-catalogue/gp-connect-access-record-structured-fhir
- aid: nhs-england:nhs-electronic-prescription-service-fhir
  name: Electronic Prescription Service (EPS) - FHIR API
  description: >-
    National service for sending electronic prescriptions from prescribers to dispensers (pharmacies),
    exposed as an HL7 FHIR R4 API. Sandbox FHIR endpoint confirmed live (returns a FHIR OperationOutcome
    when required headers are absent).
  humanURL: https://digital.nhs.uk/developer/api-catalogue/electronic-prescription-service-fhir
  baseURL: https://api.service.nhs.uk/electronic-prescriptions/FHIR/R4
  tags:
  - FHIR
