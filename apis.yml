aid: nhs-england
url: https://raw.githubusercontent.com/api-evangelist/nhs-england/refs/heads/main/apis.yml
name: NHS England
kind: company
description: 'NHS England (which absorbed NHS Digital in 2023) is the national body that runs England''s
  public health and social care API platform at digital.nhs.uk and api.service.nhs.uk. It publishes a
  large catalogue of internet-facing APIs - most of them HL7 FHIR R4 built to the FHIR UK Core profile
  - covering the national spine services: the Personal Demographics Service (PDS), GP Connect, the e-Referral
  Service (e-RS), the Electronic Prescription Service (EPS), the Organisation Data Service (ODS), Booking
  and Referral Standard (BaRS), immunisation history, the NHS App, NHS Notify, and the Directory of Healthcare
  Services. Access is governed centrally: applications onboard through the NHS API platform and authenticate
  with OAuth 2.0 bearer tokens - application-restricted (signed-JWT client credentials / API key) or user-restricted
  via NHS login (OIDC) and NHS CIS2 - with production access gated behind registration, assurance, and
  connection agreements. Home market is the United Kingdom (England). Positioning: a single national health
  system operating public, standards-based (FHIR UK Core) interoperability APIs rather than a commercial
  API vendor.'
